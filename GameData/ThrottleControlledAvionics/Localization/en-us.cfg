        #LOC_TCA_Part_TCAModuleAltitudeControl_desc = Upgrades TCA with the Altitude Control Module. This module maintains vessel's altitude in flight. Requires: Vertical Speed Control Module.
        #LOC_TCA_Part_TCAModuleAltitudeControl_title = Altitude Control Module
        #LOC_TCA_Part_TCAModuleAnchor_desc = Upgrades TCA with the Anchor Module. This module maintains vessel's position above a fixed point on the ground. Requires: Horizontal Speed Control Module.
        #LOC_TCA_Part_TCAModuleAnchor_title = Anchor Module
        #LOC_TCA_Part_TCAModuleAttitudeControl_desc = Upgrades TCA with the Attitude Control Module. This module controls vessel's attitude, using total thrust vector as a reference.
        #LOC_TCA_Part_TCAModuleAttitudeControl_title = Attitude Control Module
        #LOC_TCA_Part_TCAModuleAutoLander_desc = Upgrades TCA with the Landing Autopilot. This autopilot tries to land the vessel on a nearest suitable flat surface. Requires: Anchor Module, Altitude Control Module, Navigation Module.
        #LOC_TCA_Part_TCAModuleAutoLander_title = Landing Autopilot
        #LOC_TCA_Part_TCAModuleBallisticJump_desc = Upgrades TCA with the Ballistic Jump Autopilot. This autopilot allows you to navigate on a planet using long suborbital trajectories (think ballistic rockets). It is best used on low-gravity non-atmospheric planets. Requires: Landing Autopilot, Orbital Maneuver Autopilot.
        #LOC_TCA_Part_TCAModuleBallisticJump_title = Ballistic Jump Autopilot
        #LOC_TCA_Part_TCAModuleCollisionPreventionSystem_desc = Upgrades TCA with the Collision Prevention System. This module tries to prevent collisions with other vessels using dynamic course corrections. Requires: Horizontal Speed Control Module.
        #LOC_TCA_Part_TCAModuleCollisionPreventionSystem_title = Collision Prevention System
        #LOC_TCA_Part_TCAModuleCruiseControl_desc = Upgrades TCA with the Cruise Control Module. This module maintains vessel's bearing and speed. Requires: Horizontal Speed Control Module.
        #LOC_TCA_Part_TCAModuleCruiseControl_title = Cruise Control Module
        #LOC_TCA_Part_TCAModuleDeorbitAutopilot_desc = Upgrades TCA with the Deorbit Autopilot. This autopilot performs the full orbit-to-target landing sequence, from deorbit maneuver to touchdown on a flat surface near the target. Requires: Landing Autopilot, Orbital Maneuver Autopilot.
        #LOC_TCA_Part_TCAModuleDeorbitAutopilot_title = Deorbit Autopilot
        #LOC_TCA_Part_TCAModuleFlightStabilizer_desc = Upgrades TCA with the Flight Stabilization Module. This module tries to prevent the accidental vessel flipping due to SAS/T-SAS deactivation. Requires: Horizontal Speed Control Module.
        #LOC_TCA_Part_TCAModuleFlightStabilizer_title = Flight Stabilization Module
        #LOC_TCA_Part_TCAModuleHorizontalSpeedControl_desc = Upgrades TCA with the Horizontal Speed Control Module. This module controls horizontal component of the vessel's velocity. Requires: Attitude Control Module.
        #LOC_TCA_Part_TCAModuleHorizontalSpeedControl_title = Horizontal Speed Control Module
        #LOC_TCA_Part_TCAModuleMacroProcessor_desc = Upgrades TCA with the Macro Processor Module. This module allows to program vessel's computer to perform arbitrary tasks based on all the other TCA functions.
        #LOC_TCA_Part_TCAModuleMacroProcessor_title = Macro Processor Module
        #LOC_TCA_Part_TCAModuleManeuverAutopilot_desc = Upgrades TCA with the Orbital Maneuver Autopilot. This module automatically performs a planned orbital maneuver using available engines, no matter where they're pointed to. Requires: Attitude Control Module, Propulsion Control Module.
        #LOC_TCA_Part_TCAModuleManeuverAutopilot_title = Orbital Maneuver Autopilot
        #LOC_TCA_Part_TCAModuleMatchVelocityAutopilot_desc = Upgrades TCA with the Orbital Match Velocity Autopilot. This module tries to match orbital velocity of the vessel with that of a target. Optionally, it does so at the point of the nearest approach. Requires: Orbital Maneuver Autopilot.
        #LOC_TCA_Part_TCAModuleMatchVelocityAutopilot_title = Orbital Match Velocity Autopilot
        #LOC_TCA_Part_TCAModulePointNavigator_desc = Upgrades TCA with the Navigation Module. This module allows automatic navigation along a path of the user-defined nav-points. Requires: Horizontal Speed Control Module.
        #LOC_TCA_Part_TCAModulePointNavigator_title = Navigation Module
        #LOC_TCA_Part_TCAModuleRadar_desc = Upgrades TCA with the Radar Module. This module uses ship's radar (every ship has one, right?) to get the altitude above the surface and to avoide collisions with hills, mountains and buildings.
        #LOC_TCA_Part_TCAModuleRadar_title = Radar Module
        #LOC_TCA_Part_TCAModuleRendezvousAutopilot_desc = Upgrades TCA with the Rendezvous Autopilot. This autopilot executes a series of maneuvers to bring the ship to a target orbiting the same planet. It will work from orbit, from a suborbital trajectory and even from the ground, in which case it will first bring the ship to appropriate orbit at the right moment. Requires: Orbital Match Velocity Autopilot.
        #LOC_TCA_Part_TCAModuleRendezvousAutopilot_title = Rendezvous Autopilot
        #LOC_TCA_Part_TCAModuleSquadControl_desc = Upgrades TCA with the Squadron Control Module. This module allows to group several vessels into a squadron and control all of its TCAs from any of its vessels.
        #LOC_TCA_Part_TCAModuleSquadControl_title = Squadron Control Module
        #LOC_TCA_Part_TCAModuleThrottleControl_desc = Upgrades TCA with the Propulsion Control Module. This module provides automated control over main throttle and translation. It is mostly used by other modules, but allows also to control vertical speed and altitude from keyboard.
        #LOC_TCA_Part_TCAModuleThrottleControl_title = Propulsion Control Module
        #LOC_TCA_Part_TCAModuleToOrbitAutopilot_desc = Upgrades TCA with the To Orbit Autopilot. This autopilot launches a vessel into circular orbit with given radius and inclination using double-maneuver technique. Both ascending/descending and prograde/retrograde orbits are supported. Requires: Orbital Maneuver Autopilot.
        #LOC_TCA_Part_TCAModuleToOrbitAutopilot_title = To Orbit Autopilot
        #LOC_TCA_Part_TCAModuleVerticalSpeedControl_desc = Upgrades TCA with the Vertical Speed Control Module. This module provides control over the vertical component of the vessel's speed.
        #LOC_TCA_Part_TCAModuleVerticalSpeedControl_title = Vertical Speed Control Module
